<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 340px;
      padding: 20px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
      color: #1a1a1a;
    }

    /* Заголовок */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 16px;
      border-bottom: 1px solid #e5e5e5;
      margin-bottom: 16px;
    }

    .header h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.2px;
      color: #1a1a1a;
      text-transform: uppercase;
      font-family: 'Inter', sans-serif;
    }

    .header .badge {
      font-size: 10px;
      font-weight: 500;
      color: #888;
      background: #f0f0f0;
      padding: 2px 8px;
      border-radius: 3px;
      letter-spacing: 0.3px;
    }

    /* Информация о сайте */
    .site-info {
      font-size: 12px;
      color: #555;
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f0;
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .site-info .domain {
      color: #1a1a1a;
      font-weight: 500;
      font-family: 'Inter', monospace;
    }

    .site-info .count {
      font-weight: 600;
      color: #1a1a1a;
    }

    .site-info .count-value {
      font-weight: 600;
      font-size: 14px;
    }

    /* Кнопки */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .btn {
      padding: 10px 14px;
      border: 1px solid #d0d0d0;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.15s ease;
      background: #ffffff;
      color: #1a1a1a;
      text-align: left;
      letter-spacing: -0.1px;
    }

    .btn:hover {
      background: #f5f5f5;
      border-color: #a0a0a0;
    }

    .btn:active {
      background: #e8e8e8;
      transform: scale(0.99);
    }

    .btn-save {
      border-color: #1a1a1a;
      background: #1a1a1a;
      color: #ffffff;
    }

    .btn-save:hover {
      background: #333;
      border-color: #333;
    }

    .btn-load {
      border-color: #d0d0d0;
    }

    .btn-backup {
      border-color: #d0d0d0;
    }

    .btn-clear {
      border-color: #d0d0d0;
      color: #b00020;
    }

    .btn-clear:hover {
      background: #fdf0f0;
      border-color: #b00020;
    }

    .btn .icon {
      margin-right: 8px;
      opacity: 0.6;
      font-style: normal;
    }

    /* Разделитель */
    .divider {
      height: 1px;
      background: #f0f0f0;
      margin: 8px 0 6px 0;
    }

    /* Статус */
    .status {
      margin-top: 14px;
      padding: 10px 12px;
      font-size: 11px;
      font-family: 'Inter', monospace;
      line-height: 1.5;
      border-radius: 3px;
      display: none;
      background: #f8f8f8;
      color: #333;
      border-left: 2px solid #d0d0d0;
      max-height: 150px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .status.show {
      display: block;
    }

    .status.success {
      border-left-color: #1a1a1a;
      background: #f5f5f5;
    }

    .status.error {
      border-left-color: #b00020;
      background: #fdf5f5;
      color: #b00020;
    }

    .status.info {
      border-left-color: #888;
      background: #f8f8f8;
    }

    /* Футер */
    .footer {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #f0f0f0;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #bbb;
      text-align: center;
      font-weight: 500;
    }

    /* Скрытый input */
    .file-input {
      display: none;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Cookie Manager</h1>
    <span class="badge">v1.0</span>
  </div>

  <div class="site-info" id="siteInfo">
    <div>🌐 <span class="domain" id="domainDisplay">—</span></div>
    <div style="margin-top: 2px;">🍪 <span class="count-value" id="countDisplay">0</span> <span class="count">cookies</span></div>
  </div>

  <div class="btn-group">
    <button class="btn btn-save" id="saveBtn">
      <span class="icon">↓</span> Сохранить
    </button>
    <button class="btn btn-load" id="loadBtn">
      <span class="icon">↑</span> Загрузить
    </button>
    <button class="btn btn-backup" id="backupBtn">
      <span class="icon">⎘</span> Копировать
    </button>
    <div class="divider"></div>
    <button class="btn btn-clear" id="clearBtn">
      <span class="icon">✕</span> Очистить
    </button>
  </div>

  <input type="file" class="file-input" id="fileInput" accept=".json">

  <div class="status" id="status"></div>

  <div class="footer">Локальное хранилище</div>

  <script src="popup.js"></script>
</body>
</html>
